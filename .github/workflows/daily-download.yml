name: Download SBI forex rates

on:
  schedule:
    # 16:00 and 22:00 IST, same as sahilgupta/sbi-fx-ratekeeper
    - cron: "30 10,16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  download:
    name: Download and archive rates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download and parse rates
        run: cargo run --release

      - name: Get IST timestamp
        id: time
        run: echo "now=$(TZ=Asia/Kolkata date '+%A, %d %B %Y, %I:%M %p %Z')" >> "$GITHUB_OUTPUT"

      - name: Commit rates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Commit: SBI rates at ${{ steps.time.outputs.now }}"

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="SBI rates download failed on $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Open issue with this title already exists, skipping"
          else
            gh issue create \
              --title "$title" \
              --body "The scheduled rates download failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
